<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article to PDF</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      background: #fff;
      color: #1a1a1a;
    }

    /* ── Shared header row ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: #111;
    }

    /* ── Icon buttons (gear, back) ── */
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 16px;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: #111; background: #f0f0f0; }

    /* ── Primary save button ── */
    #save-btn {
      width: 100%;
      padding: 10px 0;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #save-btn:hover    { background: #1558b0; }
    #save-btn:disabled { background: #a8c7fa; cursor: not-allowed; }

    /* ── Status line ── */
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      min-height: 16px;
      line-height: 1.4;
    }
    #status.error   { color: #c5221f; }
    #status.success { color: #1e8e3e; }

    /* Auto-save badge shown under the button when enabled */
    #autosave-badge {
      margin-top: 8px;
      font-size: 11px;
      color: #1e8e3e;
      display: none;
    }

    /* ── Settings panel ── */
    #settings-view { display: none; }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 4px 0 14px;
    }

    .setting-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .setting-row input[type="checkbox"] {
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #1a73e8;
      width: 14px;
      height: 14px;
    }
    .setting-row .label-text {
      font-size: 13px;
      line-height: 1.4;
    }
    .setting-row .label-sub {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: #444;
      margin-bottom: 5px;
    }

    #save-folder {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    #save-folder:focus {
      outline: none;
      border-color: #1a73e8;
    }
    #save-folder:disabled {
      background: #f5f5f5;
      color: #aaa;
    }

    #margin-lr {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    #margin-lr:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .folder-hint {
      font-size: 11px;
      color: #888;
      margin-top: 5px;
    }

    #settings-save-btn {
      width: 100%;
      padding: 9px 0;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s;
    }
    #settings-save-btn:hover { background: #1558b0; }

    #settings-status {
      margin-top: 8px;
      font-size: 11px;
      color: #1e8e3e;
      min-height: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ── Main view ─────────────────────────────────────────── -->
  <div id="main-view">
    <div class="header">
      <h1>Article to PDF</h1>
      <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
    </div>

    <button id="save-btn">Save as PDF</button>
    <div id="autosave-badge">Auto-save on — no dialog will open</div>
    <div id="status"></div>
  </div>

  <!-- ── Settings view ──────────────────────────────────────── -->
  <div id="settings-view">
    <div class="header">
      <button class="icon-btn" id="back-btn" title="Back">← Back</button>
      <h1>Settings</h1>
    </div>
    <hr class="divider" />

    <label class="setting-row">
      <input type="checkbox" id="auto-save-toggle" />
      <span>
        <span class="label-text">Auto-save (no print dialog)</span>
        <span class="label-sub">PDF saves directly to your folder below.<br>
          A brief debugger bar will appear in the reader tab — that's normal.</span>
      </span>
    </label>

    <div id="folder-field">
      <div class="field-label">Save folder</div>
      <input type="text" id="save-folder" placeholder="Articles" maxlength="200" />
      <div class="folder-hint">
        Saves to <strong>~/Downloads/<span id="folder-preview">Articles</span>/</strong>
      </div>
    </div>

    <div style="margin-bottom:14px">
      <div class="field-label">Left / right page margin</div>
      <select id="margin-lr">
        <!-- options injected by popup.js -->
      </select>
    </div>

    <button id="settings-save-btn">Save Settings</button>
    <div id="settings-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
